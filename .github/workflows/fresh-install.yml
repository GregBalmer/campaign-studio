# Proves a reviewer can run Campaign Studio from a fresh copy on Windows, macOS
# and Linux: one command, no API key. Each run uploads a screenshot of the app
# as it renders on that machine.
name: Fresh install

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fresh-install:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
        exclude:
          - os: macos-latest   # stock macOS 3.9 is tested by hand; runners are ARM
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install and run, as a reviewer would
        run: python tools/smoke_test.py --screenshot app-${{ matrix.os }}-py${{ matrix.python }}.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            app-*.png
            outputs/long-light/daylight-mist/9x16/JP-ja.png
          if-no-files-found: ignore
